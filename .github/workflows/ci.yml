name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 ingestion models processing tests --max-line-length=120 --ignore=E501,W503 || true

      - name: Run tests
        run: pytest tests/ -v --cov=ingestion --cov=models --cov=processing --cov-report=term-missing

      - name: Validate DAG imports
        run: python -c "import sys; sys.path.insert(0,'.'); exec(open('dags/market_pipeline_dag.py').read().split('with DAG')[0]); print('DAG imports OK')"
